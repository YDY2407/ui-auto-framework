[pytest]
# 默认以无头模式(headless)运行，想亲眼看浏览器自动操作可加参数：pytest --headed --slowmo 500
addopts = -vs --html=reports/ui_report.html --self-contained-html
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: P0 核心冒烟 UI 流程
    negative: UI 反向异常场景
    mock: 网络拦截 Mock 场景
